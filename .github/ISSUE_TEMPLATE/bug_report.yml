name: Bug report
description: Report a bug in Opal
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Do **not** paste seed phrases, private keys, or vault passwords.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Opal version
      placeholder: 0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Redact addresses if needed; never include seeds.
